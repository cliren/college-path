    width: 100%; min-height: 44px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 10px; background: #0f4c5c; color: #fff; cursor: pointer;

<script>
(function () {
  const form = document.getElementById("form");
  const pw = document.getElementById("pw");
  const err = document.getElementById("err");
  const btn = document.getElementById("btn");
  const meta = JSON.parse(document.getElementById("payload").textContent);

  function b64ToBytes(s) {
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password, salt, iterations) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Decrypting…";
    try {
      const salt = b64ToBytes(meta.salt);
      const iv = b64ToBytes(meta.iv);
      const ct = b64ToBytes(meta.ct);
      const key = await deriveKey(pw.value, salt, meta.iter);
      const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      const html = new TextDecoder().decode(plainBuf);
      document.open();
      document.write(html);
      document.close();
    } catch (ex) {
      err.textContent = "Wrong password, or this browser cannot decrypt.";
      btn.disabled = false;
      btn.textContent = "Unlock";
      pw.select();
    }
  });
})();
</script>
